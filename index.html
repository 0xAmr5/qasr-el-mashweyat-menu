<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>قصر المشويات | قائمة الطعام</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  
  <!-- Font: Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand-info">
        <img src="./logo.svg" alt="لوجو قصر المشويات" class="logo-img" onerror="this.onerror=null; this.src='./mixed-grill.jpg';" />
        <div>
          <h1>قصر المشويات</h1>
          <p>طعم أصيل ومذاق مميز</p>
        </div>
      </div>
      <div class="header-actions">
        <!-- زر تبديل الوضع (Dark / Light) -->
        <button class="theme-toggle-btn" id="themeToggleBtn" title="تبديل الوضع" aria-label="تبديل الوضع">
          <span id="themeIcon">🌙</span>
        </button>
        <a href="tel:19888" class="call-btn" title="اتصل بنا">
          <span>19888</span>
          <span>📞</span>
        </a>
      </div>
    </div>

    <!-- شريط البحث -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن صنف أو وجبة..." autocomplete="off" />
      <button id="clearSearchBtn" class="clear-btn" aria-label="مسح البحث">✕</button>
    </div>

    <!-- شريط الأقسام السريع -->
    <nav class="categories-bar" id="categoriesBar"></nav>
  </header>

  <!-- محتوى الأقسام والوجبات -->
  <main class="menu-container" id="menuContainer"></main>

  <!-- شريط السلة العائم -->
  <aside class="floating-cart" id="floatingCart">
    <div class="cart-summary">
      <span class="cart-badge" id="cartBadge">0</span>
      <div class="cart-text">
        <span>الإجمالي:</span>
        <strong id="cartTotal">0 ج.م</strong>
      </div>
    </div>
    <button class="open-cart-btn" id="openCartBtn">عرض الطلب</button>
  </aside>

  <!-- نافذة مراجعة وتأكيد الطلب (Checkout Modal) -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-sheet">
      <div class="sheet-header">
        <h3>تفاصيل الطلب</h3>
        <button class="close-btn" id="closeCartBtn" aria-label="إغلاق النافذة">✕</button>
      </div>

      <div class="sheet-content">
        <div class="selected-items" id="selectedItemsList"></div>

        <form class="order-form" id="orderForm" onsubmit="event.preventDefault();">
          <label>
            الاسم
            <input type="text" id="custName" placeholder="اكتب اسمك الكريم" required />
          </label>
          <label>
            رقم الموبايل
            <input type="tel" id="custPhone" placeholder="01xxxxxxxxx" required />
          </label>
          <label>
            العنوان بالتفصيل
            <input type="text" id="custAddress" placeholder="المنطقة، الشارع، العمارة، الشقة..." required />
          </label>
          <label>
            ملاحظات للطلب (اختياري)
            <input type="text" id="custNotes" placeholder="أي إضافات أو تعديلات خاصة" />
          </label>
        </form>
      </div>

      <div class="sheet-footer">
        <div class="total-row">
          <span>الحساب الإجمالي:</span>
          <strong id="finalTotal">0 ج.م</strong>
        </div>
        <button class="btn-whatsapp" id="sendOrderBtn">إرسال الطلب عبر واتساب</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification التفاعلي -->
  <div class="toast-notification" id="toastNotification">
    <span class="toast-icon">✓</span>
    <span class="toast-text" id="toastText">تمت الإضافة للطلب</span>
  </div>

  <footer class="app-footer">
    <p>قصر المشويات • خدمة التوصيل متوفرة يومياً</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
