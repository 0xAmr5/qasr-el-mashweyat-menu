<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1611" />
      <stop offset="100%" stop-color="#0d0b09" />
    </linearGradient>
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d78b" />
      <stop offset="45%" stop-color="#d49638" />
      <stop offset="100%" stop-color="#966118" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#966118" />
      <stop offset="50%" stop-color="#d49638" />
      <stop offset="100%" stop-color="#966118" />
    </linearGradient>
  </defs>

  <!-- خلفية داكنة فاخرة -->
  <rect width="260" height="260" rx="52" fill="url(#bgGrad)" />

  <!-- إطار خارجي مزدوج -->
  <circle cx="130" cy="130" r="112" fill="none" stroke="url(#royalGold)" stroke-width="3.5" />
  <circle cx="130" cy="130" r="103" fill="none" stroke="url(#royalGold)" stroke-width="1" opacity="0.55" />

  <!-- قوس زخرفي علوي + تاج القصر -->
  <path d="M98 66 L106 49 L118 60 L130 43 L142 60 L154 49 L162 66 Z" fill="url(#royalGold)" />
  <rect x="98" y="69" width="64" height="3.5" rx="1.75" fill="url(#royalGold)" />

  <!-- خط فاصل علوي رفيع -->
  <line x1="62" y1="84" x2="198" y2="84" stroke="url(#royalGold)" stroke-width="1.2" opacity="0.5" />

  <!-- اسم المطعم الرئيسي -->
  <text x="130" y="120" text-anchor="middle" fill="#ffffff" font-family="&#39;Cairo&#39;, &#39;Segoe UI&#39;, Tahoma, sans-serif" font-weight="900" font-size="34" letter-spacing="0">
    قصر
  </text>
  <text x="130" y="156" text-anchor="middle" fill="url(#royalGold)" font-family="&#39;Cairo&#39;, &#39;Segoe UI&#39;, Tahoma, sans-serif" font-weight="900" font-size="31" letter-spacing="0">
    المشويات
  </text>

  <!-- شريط سفلي أنيق -->
  <rect x="58" y="172" width="144" height="24" rx="12" fill="url(#ribbonGrad)" />
  <text x="130" y="188" text-anchor="middle" fill="#120e0a" font-family="&#39;Cairo&#39;, &#39;Segoe UI&#39;, Tahoma, sans-serif" font-weight="900" font-size="12.5">
    للمأكولات الشرقية والفحم
  </text>

  <!-- زخرفة نجمية سفلية -->
  <circle cx="114" cy="212" r="2.2" fill="url(#royalGold)" />
  <polygon points="130,206 132.5,211 138,211.5 133.8,215 135,220.5 130,217.5 125,220.5 126.2,215 122,211.5 127.5,211" fill="url(#royalGold)" />
  <circle cx="146" cy="212" r="2.2" fill="url(#royalGold)" />
</svg>